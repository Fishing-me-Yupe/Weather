<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お天気NEWS - 週間天気予報</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --card-bg: rgba(255, 255, 255, 0.92);
      --accent-color: #0088ff;
      --text-main: #333333;
      --temp-high: #ff4757;
      --temp-low: #1e90ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
    }

    .tv-frame {
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 2px solid #333;
    }

    .screen {
      background: linear-gradient(to bottom, #74b9ff, #dfe6e9);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    /* ニュース番組用ヘッダー */
    .header {
      background: linear-gradient(90deg, #003366, #0066cc);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .badge {
      background: #ff0055;
      color: #fff;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .title {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    /* 操作パネル */
    .control-panel {
      background: rgba(255, 255, 255, 0.85);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      flex-wrap: wrap;
    }

    .control-panel label {
      font-weight: bold;
      color: #003366;
    }

    input[type="date"] {
      padding: 6px 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #0066cc;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    .rec-btn {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .rec-btn:hover {
      background: #ff6b81;
    }

    .rec-btn:disabled {
      background: #a4b0be;
      cursor: not-allowed;
    }

    /* 週間予報グリッド */
    .forecast-container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      padding: 20px 15px;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 6px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .date {
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
    }

    .day-of-week {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .sat { color: #0066cc; }
    .sun { color: #ff0055; }

    .weather-icon {
      font-size: 2.2rem;
      margin: 8px 0;
      line-height: 1;
    }

    .weather-text {
      font-size: 0.75rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
      min-height: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pop {
      font-size: 0.75rem;
      font-weight: bold;
      color: #0088ff;
      background: #e6f2ff;
      padding: 2px 0;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .temps {
      display: flex;
      justify-content: space-around;
      font-weight: bold;
      font-size: 0.95rem;
      border-top: 1px solid #ddd;
      padding-top: 6px;
    }

    .temp-high { color: var(--temp-high); }
    .temp-low { color: var(--temp-low); }

    /* 番組下部テロップ (CSSアニメーションからJS駆動のCSS変数へ変更) */
    .ticker {
      background: #ffcc00;
      color: #000;
      padding: 8px 15px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-label {
      background: #000;
      color: #fff;
      padding: 2px 8px;
      margin-right: 12px;
      font-size: 0.8rem;
      border-radius: 3px;
      flex-shrink: 0;
      z-index: 2;
    }

    .ticker-text-wrapper {
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .ticker-text {
      display: inline-block;
      white-space: nowrap;
      transform: translateX(var(--ticker-x, 100%));
      will-change: transform;
    }

    @media (max-width: 768px) {
      .forecast-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="tv-frame" id="export-target">
    <div class="screen">
      <div class="header">
        <div class="title">NEWS 7 WEATHER</div>
        <div class="badge">LIVE</div>
      </div>

      <div class="control-panel">
        <div>
          <label for="start-date">開始日:</label>
          <input type="date" id="start-date" onchange="updateForecast()">
        </div>
        <button class="rec-btn" id="rec-btn" onclick="startRecording()">
          🎥 1周期を動画書き出し (WebM)
        </button>
      </div>

      <div class="forecast-container" id="forecast-grid">
        </div>

      <div class="ticker">
        <span class="ticker-label">解説</span>
        <div class="ticker-text-wrapper" id="ticker-wrapper">
          <span class="ticker-text" id="commentary">季節に応じた気候傾向を表示しています。</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // 気候データベース
    const climateData = {
      1: { baseHigh: 10, baseLow: 2, rainProb: 10, comment: '空気が非常に乾燥しています。火の取り扱いとインフルエンザ対策に十分ご注意ください。' },
      2: { baseHigh: 11, baseLow: 3, rainProb: 20, comment: '暦の上では春ですが、朝晩は厳しい冷え込みが続きます。防寒対策を万全に。' },
      3: { baseHigh: 14, baseLow: 5, rainProb: 30, comment: '三寒四温の季節です。日ごとに気温差が大きくなるため体調管理にご注意ください。' },
      4: { baseHigh: 19, baseLow: 10, rainProb: 30, comment: 'ぽかぽか陽気が続きます。お出かけ日和の日が増えそうです。' },
      5: { baseHigh: 23, baseLow: 15, rainProb: 30, comment: '過ごしやすい快適な気候です。日中は少し汗ばむ陽気となるでしょう。' },
      6: { baseHigh: 26, baseLow: 20, rainProb: 70, comment: '梅雨前線の影響で曇りや雨の日が多くなります。折りたたみ傘がお守りです。' },
      7: { baseHigh: 30, baseLow: 23, rainProb: 40, comment: '梅雨明けとともに厳しい暑さがやってきます。熱中症予防を心がけてください。' },
      8: { baseHigh: 33, baseLow: 26, rainProb: 30, comment: '連日の猛暑日となる見込みです。こまめな水分補給と適切なエアコン使用を。' },
      9: { baseHigh: 28, baseLow: 21, rainProb: 50, comment: '秋雨前線や台風の影響を受けやすい時期です。最新の気象情報にご注意ください。' },
      10: { baseHigh: 22, baseLow: 14, rainProb: 20, comment: '秋晴れの爽やかな気候が続きます。朝晩の寒暖差に気をつけましょう。' },
      11: { baseHigh: 17, baseLow: 8, rainProb: 20, comment: '季節の歩みとともに木々が色づき、冬の足音が聞こえてきます。' },
      12: { baseHigh: 12, baseLow: 4, rainProb: 10, comment: '冬型の気圧配置が強まり、朝晩を中心に冷え込みが厳しくなります。' }
    };

    const weatherList = [
      { text: '晴れ', icon: '☀️' },
      { text: '晴れのち曇り', icon: '🌤️' },
      { text: '曇り時々晴れ', icon: '⛅' },
      { text: '曇り', icon: '☁️' },
      { text: '雨時々曇り', icon: '🌧️' },
      { text: '大雨', icon: '☔' },
      { text: '雷雨', icon: '⛈️' }
    ];

    const weekDays = ['日', '月', '火', '水', '木', '金', '土'];

    // テロップアニメーション用変数
    let tickerProgress = 0; // 0.0 ～ 1.0 (1周期)
    const DURATION = 10; // テロップが右から左へ流れる時間（秒）
    let lastTime = null;

    window.onload = () => {
      const dateInput = document.getElementById('start-date');
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      dateInput.value = `${yyyy}-${mm}-${dd}`;

      updateForecast();
      requestAnimationFrame(animateTicker);
    };

    // テロップのスクロールアニメーション処理
    function animateTicker(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      tickerProgress += delta / DURATION;
      if (tickerProgress >= 1) {
        tickerProgress %= 1; // 1周期完了したらループ
      }

      // 右端 (100%) から 左端 (-100%) へ移動
      const currentX = 100 - (tickerProgress * 200);
      document.getElementById('commentary').style.setProperty('--ticker-x', `${currentX}%`);

      requestAnimationFrame(animateTicker);
    }

    function updateForecast() {
      const dateVal = document.getElementById('start-date').value;
      if (!dateVal) return;

      const [year, month, day] = dateVal.split('-').map(Number);
      const grid = document.getElementById('forecast-grid');
      const commentary = document.getElementById('commentary');

      grid.innerHTML = '';
      commentary.textContent = climateData[month].comment;

      // 日付を変えたらアニメーションの進行度をリセット
      tickerProgress = 0;

      for (let i = 0; i < 7; i++) {
        const currentDate = new Date(year, month - 1, day + i);
        const currentMonth = currentDate.getMonth() + 1;
        const data = climateData[currentMonth];

        const dayOfWeek = weekDays[currentDate.getDay()];
        const dayClass = currentDate.getDay() === 0 ? 'sun' : (currentDate.getDay() === 6 ? 'sat' : '');

        const tempVariation = Math.floor(Math.random() * 5) - 2;
        const highTemp = data.baseHigh + tempVariation;
        const lowTemp = data.baseLow + Math.floor(Math.random() * 3) - 1;

        let pop = Math.min(100, Math.max(0, data.rainProb + (Math.floor(Math.random() * 5) - 2) * 10));
        let weatherIdx = pop >= 70 ? (Math.random() < 0.5 ? 4 : 5) : (pop >= 40 ? (Math.random() < 0.5 ? 2 : 3) : (Math.random() < 0.6 ? 0 : 1));
        const weather = weatherList[weatherIdx];

        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
          <div>
            <div class="date">${currentDate.getMonth() + 1}/${currentDate.getDate()}</div>
            <div class="day-of-week ${dayClass}">(${dayOfWeek})</div>
          </div>
          <div class="weather-icon">${weather.icon}</div>
          <div class="weather-text">${weather.text}</div>
          <div class="pop">💧 ${pop}%</div>
          <div class="temps">
            <span class="temp-high">${highTemp}℃</span>
            <span class="temp-low">${lowTemp}℃</span>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    /* 🎬 1周期分を録画してWebM動画を出力する機能 */
    async function startRecording() {
      const btn = document.getElementById('rec-btn');
      btn.disabled = true;
      btn.textContent = '⏳ 録画中... (1周期分)';

      // アニメーションの位置を先頭(0%)に揃える
      tickerProgress = 0;

      const targetEl = document.getElementById('export-target');
      
      // 描画用の隠しCanvasを作成
      const canvas = document.createElement('canvas');
      canvas.width = targetEl.offsetWidth;
      canvas.height = targetEl.offsetHeight;
      const ctx = canvas.getContext('2d');

      // Canvasからストリームを取得 (30fps)
      const stream = canvas.captureStream(30);
      const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        // 動画ファイルのダウンロード処理
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `weather-forecast-${document.getElementById('start-date').value}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        btn.disabled = false;
        btn.textContent = '🎥 1周期を動画書き出し (WebM)';
      };

      mediaRecorder.start();

      // 1周期（10秒間）フレーム毎にDOMをCanvasにキャプチャする
      const startTime = performance.now();
      const recordInterval = setInterval(async () => {
        const elapsedTime = (performance.now() - startTime) / 1000;
        
        // DOMの現在のグラフィック状態をCanvasに変換
        const tempCanvas = await html2canvas(targetEl, { logging: false, scale: 1 });
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 0, 0);

        // 10秒（1周期）経過したら停止
        if (elapsedTime >= DURATION) {
          clearInterval(recordInterval);
          mediaRecorder.stop();
        }
      }, 1000 / 30); // 約30fps周期で更新
    }
  </script>
</body>
</html>
